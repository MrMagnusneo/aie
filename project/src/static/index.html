<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Move Classifier</title>
    <meta name="description" content="Веб-интерфейс классификатора шахматных ходов на базе ИИ.">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Chess Move Classifier</h1>
        <span class="status" id="model-status">загрузка…</span>
    </header>

    <main>
        <!-- Left: board -->
        <section class="board-section">
            <div class="board-info">
                <span id="turn-indicator">Ход белых</span>
                <span id="game-status"></span>
            </div>
            <div class="board-wrap">
                <img id="board-img" src="/board_svg" alt="Шахматная доска" draggable="false">
                <div class="click-grid" id="click-grid"></div>
            </div>
            <div class="buttons">
                <button id="btn-reset">Сброс</button>
                <button id="btn-undo" disabled>Назад</button>
                <button id="btn-ai-move" class="accent">Ход ИИ</button>
            </div>
            <div class="toggles">
                <label><input type="checkbox" id="play-ai-toggle"> Игра против ИИ</label>
                <label><input type="checkbox" id="self-play-toggle"> Автоигра ИИ vs ИИ</label>
            </div>
            <div class="speed-row" id="speed-control-container" style="display:none">
                <span>Скорость: <strong id="speed-value">1.0 с</strong></span>
                <input type="range" id="autoplay-speed" min="0.5" max="3" step="0.1" value="1.0">
            </div>
            <div class="fen-row">
                <input type="text" id="fen-input" placeholder="FEN позиция…">
                <button id="btn-load-fen">Загрузить</button>
            </div>
        </section>

        <!-- Right: AI analysis -->
        <section class="info-section">
            <div class="best-move-box">
                <div class="best-label">Лучший ход (ИИ)</div>
                <div class="best-body">
                    <span class="best-san" id="best-move-san">—</span>
                    <span class="best-uci" id="best-move-uci"></span>
                    <span class="best-prob" id="best-move-prob"></span>
                </div>
            </div>

            <div class="candidates-box">
                <div class="candidates-header">
                    <strong>Ранжирование ходов</strong>
                    <span id="moves-count">0</span>
                </div>
                <div class="candidates-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>Ход</th>
                                <th>UCI</th>
                                <th>P, %</th>
                                <th>Оценка</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="candidates-body">
                            <tr><td colspan="5" class="empty">Нет данных</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="meta-box">
                <span>Модель: <strong id="meta-model-path">—</strong></span>
                <span>Игры: <strong id="meta-train-games">—</strong></span>
                <span>Полуходы: <strong id="meta-train-plies">—</strong></span>
                <span>AP: <strong id="meta-train-ap">—</strong></span>
            </div>
        </section>
    </main>
</div>

<div id="toast" class="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
